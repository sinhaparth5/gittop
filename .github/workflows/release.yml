name: Release

# Cutting a release is a tag and nothing else:
#
#   git tag v2026.08.0 && git push origin v2026.08.0
#
# Everything below runs from that tag: the notes come out of CHANGELOG.md, the
# .deb and the tarball are built here, and all three are attached to one
# release. Nothing is published until every check has passed, so a bad tag fails
# loudly instead of leaving a half-finished release page behind.
on:
  push:
    tags:
      - "v*"

# Publishing a release writes to the repository, and the default token is
# read-only for this event.
permissions:
  contents: write

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest

    # The runner is deliberately `ubuntu-latest` — a pinned runner image is one
    # GitHub eventually retires, and the release then fails for a reason that
    # has nothing to do with gittop. What actually has to be old is the glibc
    # the binary is compiled against, and that comes from this container rather
    # than from the runner:
    #
    # gittop links dynamically, so the glibc it was built against becomes a
    # floor. Built on a current runner it demands GLIBC_2.43 and refuses to
    # start anywhere else with "version `GLIBC_2.43' not found" — which reads as
    # a corrupt download rather than an unsupported system. Built here it needs
    # only 2.35 and runs on everything from Ubuntu 22.04 and Debian 12 onward.
    #
    # 22.04 rather than something older still, because the .deb's dependencies
    # are resolved against this image too: 20.04 would produce a package
    # depending on libssl1.1, which no current distribution ships. This is the
    # oldest base whose library names are still the ones in use.
    container:
      image: ubuntu:22.04

    steps:
      # Before apt or the compiler, so a bad tag or a missing changelog section
      # fails in seconds rather than after ten minutes of building libgit2.
      - name: Install what checkout needs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The tag is what people install and the CMake version is what the binary
      # reports. If they disagree, `gittop --version` contradicts the release it
      # came from, and now is the only cheap moment to notice.
      - name: Check the tag against CMakeLists.txt
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          declared=$(sed -n 's/^project(gittop VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -z "$declared" ]; then
            echo "could not read the version out of CMakeLists.txt" >&2
            exit 1
          fi
          if [ "$declared" != "$VERSION" ]; then
            echo "tag says $VERSION, CMakeLists.txt says $declared" >&2
            echo "bump project(gittop VERSION ...) and re-tag, or tag v$declared" >&2
            exit 1
          fi
          echo "version $declared matches the tag"

      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/changelog-section.sh "$VERSION" > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Install the toolchain
        run: |
          # `file` is needed by CPack's DEB generator for
          # CPACK_DEBIAN_PACKAGE_SHLIBDEPS, and it is not a dependency of
          # anything else here — it is simply present on ordinary systems, which
          # is why this only shows up on a minimal container installed with
          # --no-install-recommends. dpkg-shlibdeps and objdump, the other two
          # tools that step needs, do come with build-essential.
          apt-get install -y --no-install-recommends \
            build-essential pkg-config python3-pip file \
            libcurl4-openssl-dev zlib1g-dev desktop-file-utils
          # 22.04 ships CMake 3.22 and this project needs 3.24 or newer. The pip
          # wheel is a plain binary and avoids pinning a download URL that would
          # rot on its own schedule.
          pip3 install --no-cache-dir "cmake>=3.24"
          cmake --version

      - name: Validate the desktop entry
        run: desktop-file-validate packaging/gittop.desktop

      # Release, not Debug: this binary is the one people run.
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Package
        working-directory: build
        run: |
          cpack -G DEB
          cpack -G TGZ
          ls -lh ./*.deb ./*.tar.gz

      # Two failures this catches, both of which otherwise only appear after
      # publishing: a package that installs but cannot run, and a binary whose
      # glibc floor is higher than the base it was supposed to be built against.
      - name: Smoke-test the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # apt rather than `dpkg -i`, because apt resolves the Depends field
          # and therefore proves it is satisfiable. dpkg would unpack the
          # package regardless and leave a broken install that still runs here,
          # which is the failure a user hits and CI would not.
          apt-get install -y ./build/*.deb
          got=$(gittop --version)
          echo "installed binary reports: $got"
          [ "$got" = "gittop $VERSION" ] || { echo "expected gittop $VERSION" >&2; exit 1; }
          gittop --config-path

          # The floor this container exists to enforce. Compared with sort -V
          # rather than a pattern, because the symbol list legitimately contains
          # three-component versions like 2.2.5 that any regex for "2.35 or
          # below" gets wrong in one direction or the other.
          floor=2.35
          highest=$(objdump -T /usr/bin/gittop \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "highest glibc symbol required: $highest (floor $floor)"
          if [ "$(printf '%s\n%s\n' "$highest" "$floor" | sort -V | tail -1)" != "$floor" ]; then
            echo "binary demands glibc $highest — it will not start on Debian 12" >&2
            exit 1
          fi

      # Everything the publish job needs, collected into one directory.
      #
      # This exists because upload-artifact roots the artifact at the least
      # common ancestor of the paths it matched. Listing `build/*.deb` beside
      # `release-notes.md` puts that ancestor at the workspace, so the packages
      # arrive at `build/*.deb` on the other side and only the notes land where
      # they were asked for — which is a layout nobody wrote down and which
      # changes shape the next time a file is added to the list. A single
      # directory makes the ancestor `dist` and the layout flat by construction.
      - name: Stage the artifacts
        run: |
          mkdir -p dist
          cp build/*.deb build/*.tar.gz release-notes.md dist/
          ls -1 dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  windows:
    name: Build and package (Windows)
    runs-on: windows-latest

    # A separate job rather than a matrix entry on the one above. The two share
    # no steps worth sharing: that one runs in a glibc-floor container, installs
    # apt packages, validates a desktop entry and checks an ELF symbol table,
    # and every one of those is meaningless here. A matrix would be a matrix of
    # `if:` conditions.
    #
    # There is no MSVC equivalent of the glibc floor. The Visual C++ runtime is
    # linked statically below instead, which removes the question rather than
    # bounding it — a user who has never installed a redistributable can still
    # run the binary.

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version from the tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The same check the Linux job makes, and it has to be made here too: this
      # job can be the one that runs first, and finding out after twenty minutes
      # of building libgit2 is worse than finding out now.
      - name: Check the tag against CMakeLists.txt
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          declared=$(sed -n 's/^project(gittop VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$declared" != "$VERSION" ]; then
            echo "tag says $VERSION, CMakeLists.txt says $declared" >&2
            exit 1
          fi
          echo "version $declared matches the tag"

      # Before the compiler, because it takes a second and answers the question
      # that otherwise costs twenty minutes of MSVC to ask. libstdc++ hands over
      # symbols through headers that MSVC's STL does not, so a missing include
      # builds everywhere except here — which is how the first tagged Windows
      # release failed, on `std::back_inserter` without <iterator>.
      # Quoted: an unquoted value containing ":" followed by a space is a nested
      # mapping to YAML, and "std:: symbol" is exactly that shape.
      - name: "Check every std:: symbol has its header"
        shell: bash
        run: ./scripts/check-includes.py

      # NSIS is not on the windows-latest image. It was once, which is exactly
      # why this step exists rather than an assumption that it is there — the
      # runner image is not part of this repository and drops things on its own
      # schedule, and the failure lands on a tag, where it is most expensive.
      #
      # Before the build, not next to the packaging it serves. It depends on
      # nothing the build produces, and putting it here makes a broken install
      # cost one minute instead of the sixteen it takes to compile libgit2,
      # libcurl and FTXUI first — which is what the last tag paid.
      #
      # CPack locates makensis through the registry key the installer writes
      # rather than by searching PATH, so the PATH line is belt to that braces.
      # The explicit version check turns "not installed" into a failure with an
      # obvious cause here, instead of three lines of CPack error later.
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsis = "C:\Program Files (x86)\NSIS"
          echo $nsis >> $env:GITHUB_PATH
          & "$nsis\makensis.exe" /VERSION

      # MSVC's static runtime. The dynamic one would make the binary depend on a
      # Visual C++ redistributable that most machines have and some do not, and
      # the failure when it is missing is a dialog about a missing DLL rather
      # than anything a user could act on.
      - name: Build
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release -j

      - name: Package
        shell: bash
        working-directory: build
        run: |
          cpack -G ZIP -C Release
          cpack -G NSIS -C Release
          ls -lh ./*.zip ./*.exe

      # The Windows counterpart of the .deb smoke test, and it catches the same
      # class of failure: an artifact that builds and does not run. Everything
      # here is done against the *unpacked package* rather than against
      # build/gittop.exe, because what ships is the package.
      - name: Smoke-test the package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Expand-Archive rather than unzip: the bash here is Git for Windows',
          # and it does not ship unzip. PowerShell is the thing guaranteed to be
          # on this machine.
          powershell -NoProfile -Command \
            "Expand-Archive -Path 'build/gittop-$VERSION-windows-x86_64.zip' -DestinationPath 'unpacked' -Force"
          exe=$(find unpacked -name gittop.exe | head -1)
          [ -n "$exe" ] || { echo "no gittop.exe in the package" >&2; exit 1; }
          echo "testing $exe"

          got=$("$exe" --version)
          echo "packaged binary reports: $got"
          [ "$got" = "gittop $VERSION" ] || { echo "expected gittop $VERSION" >&2; exit 1; }

          # Must land under %APPDATA%, not in a Unix-shaped path. This is the one
          # thing the cross-build under Wine cannot check, since Wine synthesises
          # its own profile directory.
          path=$("$exe" --config-path)
          echo "config path: $path"
          case "$path" in
            *AppData*gittop*config.toml) ;;
            *) echo "config path is not under AppData: $path" >&2; exit 1 ;;
          esac

          # Writing it exercises platform::RestrictToOwner, which is the riskiest
          # thing in the port: a DACL that fails to apply must fail loudly, and a
          # non-zero exit here is what proves it did not silently do nothing.
          "$exe" --init-config
          "$exe" --init-config && { echo "second --init-config should have failed" >&2; exit 1; }
          echo "config written and re-write refused, as expected"

      # The installer, on real Windows. Everything above tests the zip, and the
      # zip cannot go wrong in the way the installer did: CPack's NSIS template
      # hardcodes $INSTDIR\bin for both the add-to-PATH step and DisplayIcon, so
      # a packaging change that moves the binary anywhere else turns the PATH
      # option into a silent no-op — installer exits 0, "add to PATH" ticked,
      # nothing added, no error to find. That shipped as issue 26 and nothing
      # here would have caught it, because nothing here ever ran the .exe.
      #
      # This installs to a scratch directory and asserts the layout only. The
      # PATH write itself is covered by scripts/check-installer.sh under Wine,
      # which can plant a hostile PATH and roll the machine back afterwards; a
      # runner is the wrong place to rewrite the system environment, and the
      # shipped installer defaults to not touching PATH anyway, so a silent
      # install exercises the layout and not the write. The layout is the part
      # that broke.
      - name: Smoke-test the installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/gittop-*-windows-x86_64.exe | Select-Object -First 1
          $dest = "$env:RUNNER_TEMP\gittop-install"
          # /S must come first and /D last, unquoted, or NSIS reads neither.
          Start-Process -FilePath $exe.FullName -ArgumentList "/S", "/D=$dest" -Wait
          if (-not (Test-Path "$dest\bin\gittop.exe")) {
            Write-Error "gittop.exe is not at `$INSTDIR\bin, which is where the installer points PATH and DisplayIcon"
            Get-ChildItem -Recurse $dest | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          Write-Host "installed: $(& "$dest\bin\gittop.exe" --version)"
          Start-Process -FilePath "$dest\Uninstall.exe" -ArgumentList "/S" -Wait

      # No `|| true` on the installer. It was written that way when NSIS was
      # assumed present, which made a missing installer a silent omission — the
      # job goes green and the release page simply has one fewer download than
      # the README promises. Both artifacts are deliverables; a missing one is a
      # failure.
      - name: Stage the artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/*.zip dist/
          cp build/*.exe dist/
          ls -1 dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-files-windows
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build, windows]
    # Plain runner: this job only needs the gh CLI, which is preinstalled here
    # and absent from the build container.
    runs-on: ubuntu-latest

    steps:
      # Both jobs' artifacts, flattened into one directory. merge-multiple is
      # what puts them side by side rather than in a subdirectory each, which is
      # what the globs below assume.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-files*
          merge-multiple: true

      # A missing file here reaches `gh` as an unexpanded glob and fails as a
      # shell error about `./*.deb`, which says nothing about what was actually
      # downloaded. Check first and print the directory.
      #
      # The Windows artifacts are in this list for a specific reason: a release
      # that quietly ships without them looks exactly like a successful one, and
      # the person who notices is a Windows user who cannot find a download.
      - name: Check what came back
        run: |
          ls -lR .
          for pattern in ./*.deb ./*.tar.gz ./*.zip ./*.exe ./release-notes.md; do
            # shellcheck disable=SC2086
            set -- $pattern
            [ -f "$1" ] || { echo "no artifact matching $pattern" >&2; exit 1; }
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "gittop ${TAG#v}" \
            --notes-file release-notes.md \
            --verify-tag \
            ./*.deb ./*.tar.gz ./*.zip ./*.exe
